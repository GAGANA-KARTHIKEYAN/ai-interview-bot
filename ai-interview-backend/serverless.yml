service: ai-interview-backend

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  stage: dev
  timeout: 30
  memorySize: 512
  apiGateway:
    binaryMediaTypes:
      - '*/*'
  environment:
    GROQ_API_KEY: ${env:GROQ_API_KEY, ''}
    SUPABASE_URL: ${env:SUPABASE_URL, ''}
    SUPABASE_KEY: ${env:SUPABASE_KEY, ''}
    DATA_DIR: /tmp/data
    RESUMES_DIR: /tmp/data/resumes
    PROFILES_FILE: /tmp/data/profiles.json
    USERS_FILE: /tmp/data/users.json

functions:
  api:
    handler: app.handler
    events:
      - http:
          path: /
          method: any
          cors: true
      - http:
          path: /{proxy+}
          method: any
          cors: true

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true

package:
  patterns:
    - "!venv/**"
    - "!.git/**"
    - "!__pycache__/**"
    - "!node_modules/**"
