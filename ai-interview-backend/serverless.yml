service: ai-interview-backend
useDotenv: true

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  stage: dev
  timeout: 30
  memorySize: 512
  apiGateway:
    binaryMediaTypes:
      - '*/*'
  environment:
    GROQ_API_KEY: ${env:GROQ_API_KEY, ''}
    APP_REGION: ${env:APP_REGION, 'us-east-1'}
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME, 'ai-interview-bot-storage'}
    DATA_DIR: /tmp/data
    RESUMES_DIR: /tmp/data/resumes
    PROFILES_FILE: /tmp/data/profiles.json
    USERS_FILE: /tmp/data/users.json

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Scan
        - dynamodb:Query
      Resource: "arn:aws:dynamodb:${self:provider.region}:*:table/Interview*"
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:GetObject
        - s3:DeleteObject
        - s3:ListBucket
      Resource: "arn:aws:s3:::${self:provider.environment.S3_BUCKET_NAME}*"
    - Effect: Allow
      Action:
        - bedrock:InvokeModel
      Resource: "*"


functions:
  api:
    handler: app.handler
    events:
      - http:
          path: /
          method: any
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - email
      - http:
          path: /{proxy+}
          method: any
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - email

plugins:
  - serverless-python-requirements


custom:
  pythonRequirements:
    dockerizePip: true
    useDownloadCache: false
    useStaticCache: false
    strip: false
    slim: false

package:
  patterns:
    - "!venv/**"
    - "!.git/**"
    - "!__pycache__/**"
    - "!node_modules/**"
    - "!.env"
    - "!aws_setup_log.txt"
    - "!*.md"
    - "!*.exe"

resources:
  Resources:
    GatewayResponseDefault4XX:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
    GatewayResponseDefault5XX:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi

